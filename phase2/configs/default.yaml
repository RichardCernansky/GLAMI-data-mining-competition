paths:
  raw_data: "../phase1/data/raw"
  processed_data: "../phase1/data/processed/"
  embeddings: "../phase1/data/processed/embeddings"  # reuse phase1 embeddings directly
  submissions: "data/submissions"
  images: "../phase1/data/raw/fit_dataset_images" # reuse phase1 images


embedding:
  # model_name: "paraphrase-multilingual-mpnet-base-v2"  #embed_tag: null
  # model_name: "intfloat/multilingual-e5-large"         #embed_tag: "e5"
  model_name: "data/finetuned-product-encoder"
  embed_tag: "ft"   # tag appended to filenames: phase1_ft_embeddings.npy, train_ft_embeddings.npy
  batch_size: 32 
  normalize: true
  max_description_length: 500

faiss:
  k_neighbors: 20
  edge_threshold: 0.965 # cosine similarity threshold used when the scorer is not active
  use_image: false
  text_weight: 0.6
  image_weight: 0.4
  n_cells: 400
  n_probe: 40

clustering:
  algorithm: leiden  # leiden | louvain  
  resolution: 1.0

scorer:
  model_path: "../phase1/data/processed/edge_scorer.joblib"          # set to path of edge_scorer.joblib after training
  initial_threshold: 0.6      # loose FAISS pre-filter when scorer is active (more candidates)
  lgbm_threshold: 0.88        # LightGBM probability threshold to keep an edge

currency:
  sk: 1.0
  hr: 1.0
  lv: 1.0
  si: 1.0
  gr: 1.0
  it: 1.0
  lt: 1.0
  ee: 1.0
  cz: 0.04
  bg: 0.5112
  hu: 0.0025
  ro: 0.2
  pl: 0.2326
